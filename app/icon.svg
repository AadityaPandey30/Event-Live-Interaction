<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#266555" />
      <stop offset="50%" stop-color="#4f9b85" />
      <stop offset="100%" stop-color="#c9a961" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#4f9b85" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background tile in Catalygn deep ink -->
  <rect width="32" height="32" rx="7.5" fill="#12161d" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" fill="none" stroke="#266555" stroke-opacity="0.25" stroke-width="1" />

  <!-- Vitality & Growth Edge Pulse -->
  <path
    d="M 4 19 L 9 19 L 12 13 L 15.5 23 L 20.5 7 L 24.5 15 L 28 15"
    fill="none"
    stroke="url(#grad)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Peak Indicator Node (Catalygn Gold) -->
  <circle cx="20.5" cy="7" r="1.75" fill="#c9a961" />
</svg>
